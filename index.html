<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字翻翻卡">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>單字翻翻卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-width column. Home lists the word sets; Study is one big card with the action bar pinned under it.
   Identity: ink-navy on cool paper, with a highlighter-yellow swipe behind the word being studied. */
:root{
  --paper:#F2F4F8;
  --card:#FFFFFF;
  --ink:#14203A;
  --ink-2:#4B587A;
  --line:#D9DEEA;
  --hl:#FFD83D;
  --hl-soft:#FFE98F;
  --go:#17794F;
  --go-ink:#FFFFFF;
  --go-fg:#17794F;
  --go-soft:#DDF2E7;
  --btn:#14203A;
  --btn-ink:#F2F4F8;
  --danger:#B4321F;
  --shadow:0 1px 0 rgba(20,32,58,.06),0 14px 34px -18px rgba(20,32,58,.35);
  --font-display:"Bricolage Grotesque","Noto Sans TC","PingFang TC",sans-serif;
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1320;--card:#171E30;--ink:#EAEFFA;--ink-2:#A5B0CC;--line:#2B3552;
    --hl:rgba(255,216,61,.38);--hl-soft:rgba(255,216,61,.26);
    --go:#34B67C;--go-ink:#04170E;--go-fg:#6FDDA8;--go-soft:rgba(52,182,124,.2);
    --btn:#EAEFFA;--btn-ink:#0E1320;--danger:#FF8F7E;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1320;--card:#171E30;--ink:#EAEFFA;--ink-2:#A5B0CC;--line:#2B3552;
  --hl:rgba(255,216,61,.38);--hl-soft:rgba(255,216,61,.26);
  --go:#34B67C;--go-ink:#04170E;--go-fg:#6FDDA8;--go-soft:rgba(52,182,124,.2);
  --btn:#EAEFFA;--btn-ink:#0E1320;--danger:#FF8F7E;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
button,input,label{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-width:0}
.screen{height:100%;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:4px 10px;flex:none}
.bar-btns{display:flex;gap:2px}
.brand{font:700 1.65rem/1.15 var(--font-display);margin:0;letter-spacing:-.01em}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56% 94%,transparent 94%);padding:0 .1em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.icon-btn{width:44px;height:44px;border:0;background:transparent;color:var(--ink);border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--line)}
.icon-btn.ring{border:1px solid var(--line);background:var(--card)}
svg{display:block}
.icon-btn svg,.speak svg,.btn svg,.chip svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn svg{width:22px;height:22px}

.note{display:grid;gap:10px;padding:14px 16px;border-radius:14px;background:var(--hl-soft);margin-bottom:14px}
.note p{margin:0;font-size:.95rem}
.note .btn{flex:none;justify-self:start;min-height:44px;padding:0 18px}
.cats{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cat{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px}
.cat-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:14px 4px 14px 16px;cursor:pointer;border-radius:16px 0 0 16px;display:grid;gap:7px}
.cat-main:active{background:var(--paper)}
.cat-name{font-weight:700;font-size:1.1rem;line-height:1.3;overflow-wrap:anywhere}
.cat.is-done .cat-name::after{content:" ✓";color:var(--go-fg)}
.cat-meta{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--go);border-radius:99px}
.cat-more{align-self:center;margin-right:4px}
.foot{color:var(--ink-2);font-size:.82rem;padding-block:16px 8px;margin:0}

.study-bar{padding-block:0 6px}
.study-title{flex:1;min-width:0;text-align:center;display:grid;line-height:1.3}
.study-title b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-title span{font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;flex:none}
.progress div{height:100%;background:var(--ink);width:0;transition:width .25s}
.card-wrap{display:flex;padding-block:12px}
.card{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px 18px 24px}
.card-top{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;line-height:1;padding:6px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2)}
.chip svg{width:13px;height:13px;stroke-width:2.6}
.chip-go{background:var(--go-soft);color:var(--go-fg);border-color:transparent}
.card-body{margin-block:auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.word{font:700 clamp(2.3rem,12vw,3.6rem)/1.15 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere;max-width:100%}
.zh-big{font-weight:700;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
.zh-mid{font-weight:700;font-size:clamp(1.6rem,7.5vw,2.1rem);line-height:1.3;overflow-wrap:anywhere}
.speak{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:0 16px 0 12px;font-size:.9rem;cursor:pointer;min-height:44px}
.speak svg{width:20px;height:20px}
.speak:active,.icon-btn.ring:active{background:var(--paper)}
.hint{color:var(--ink-2);font-size:.9rem;margin:0}
.answer{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;border-top:1.5px dashed var(--line);padding-top:18px}
.example{width:100%;text-align:left;background:var(--paper);border-radius:14px;padding:12px 8px 12px 16px;display:grid;gap:6px}
.ex-label{font-size:.72rem;letter-spacing:.14em;color:var(--ink-2);font-weight:700}
.ex-row{display:flex;gap:6px;align-items:flex-start}
.ex-text{flex:1;min-width:0;display:grid;gap:6px;padding-top:2px}
.ex-en{margin:0;font-size:1.08rem;line-height:1.55;overflow-wrap:anywhere}
.ex-zh{margin:0;color:var(--ink-2);font-size:.95rem;overflow-wrap:anywhere}
mark{background:var(--hl-soft);color:inherit;border-radius:3px;padding:0 .12em}
.done .word{margin-bottom:2px}
.done-text{margin:0;color:var(--ink-2)}
.done-btns{display:grid;gap:10px;width:100%;margin-top:6px}

.actions{flex:none;display:flex;gap:10px;padding-block:10px 4px}
.btn{flex:1;min-height:54px;border-radius:16px;border:1.5px solid var(--btn);background:transparent;color:var(--ink);font-weight:700;font-size:.97rem;line-height:1.25;cursor:pointer;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-prev{flex:none;width:54px;padding:0}
.btn:disabled{opacity:.35;cursor:default}
.file-btn{display:flex}

.sheet-back{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;outline:none;
  padding-top:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:grid;gap:14px;box-shadow:0 -12px 40px rgba(0,0,0,.3)}
.sheet>*{min-width:0}
.sheet .btn{flex:none}
.sheet-title{font:700 1.3rem/1.3 var(--font-display);margin:0}
.muted{color:var(--ink-2);font-size:.92rem;margin:0}
.err{margin:0;color:var(--danger);font-size:.92rem;font-weight:500}
.group{display:grid;gap:8px}
.group-label{font-size:.78rem;letter-spacing:.1em;color:var(--ink-2);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:500;font-size:.95rem;min-height:42px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,32,58,.25)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.switch:checked{background:var(--go)}
.switch:checked::after{transform:translateX(20px)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.85rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--paper);font-weight:700}
.sum{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.sum li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--paper);border-radius:12px}
.sum li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:99px;font-size:.9rem;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app" class="wrap">
  <section id="home" class="screen">
    <header class="bar">
      <h1 class="brand">單字<span class="hl">翻翻卡</span></h1>
      <div class="bar-btns">
        <button class="icon-btn" id="btnImport" type="button" aria-label="匯入 Excel"></button>
        <button class="icon-btn" id="btnSettings" type="button" aria-label="設定"></button>
      </div>
    </header>
    <div class="scroll" id="homeScroll">
      <div id="emptyNote" class="note" hidden>
        <p><b>還沒有單字。</b>匯入你的 Excel 就能開始背誦。</p>
        <button class="btn btn-primary" id="btnImport2" type="button">匯入 Excel</button>
      </div>
      <ul id="catList" class="cats"></ul>
      <p class="foot" id="homeFoot"></p>
    </div>
  </section>

  <section id="study" class="screen" hidden>
    <header class="bar study-bar">
      <button class="icon-btn" id="btnBack" type="button" aria-label="回到分類"></button>
      <div class="study-title"><b id="stCat"></b><span id="stCount"></span></div>
      <button class="icon-btn" id="btnSettings2" type="button" aria-label="設定"></button>
    </header>
    <div class="progress" aria-hidden="true"><div id="progFill"></div></div>
    <div class="scroll card-wrap" id="cardWrap"><article id="card" class="card"></article></div>
    <footer class="actions" id="actions"></footer>
  </section>

  <div id="sheetBack" class="sheet-back" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

/* ==core:start== */
const ALL='*all*';
const ALIAS={
  en:['英文','英文單字','單字','english','word','vocabulary','vocab','en'],
  zh:['中文','中文意思','意思','翻譯','中譯','chinese','meaning','translation','zh'],
  pos:['詞性','pos','partofspeech'],
  ex:['例句','英文例句','例句英文','例句(英)','例句（英）','example','sentence','examplesentence'],
  exZh:['例句中文','例句翻譯','例句中譯','中文例句','例句(中)','例句（中）','exampletranslation','sentencetranslation'],
  cat:['分類','類別','主題','category','group','topic']
};
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[\s_\-－—()（）\[\]【】.:：]/g,'');}
Object.keys(ALIAS).forEach(function(k){ALIAS[k]=ALIAS[k].map(norm);});
function fieldOf(cell){
  const n=norm(cell); if(!n) return null;
  const keys=Object.keys(ALIAS);
  for(let i=0;i<keys.length;i++){ if(ALIAS[keys[i]].indexOf(n)>=0) return keys[i]; }
  return null;
}
const CJK=/[㐀-鿿]/;
function tidy(s){
  return String(s==null?'':s).replace(/ /g,' ').replace(/\s+/g,' ').trim()
    .replace(/\s+([.,!?;:])/g,'$1').replace(/(\d)-\s+([A-Za-z])/g,'$1-$2');
}
function splitHl(raw){
  const s=String(raw==null?'':raw).replace(/ /g,' ').trim();
  if(!s) return {text:'',hl:''};
  const segs=s.split(/\s{2,}/);
  let hl='';
  if(segs.length===3){hl=segs[1];}
  else if(segs.length===2){
    const m=segs[1].match(/^(.*?)\s+[.,!?;:]/);
    if(m&&m[1]) hl=m[1];
    else if(/-\s\S+$/.test(segs[0])) hl=segs[0].match(/(\S+)$/)[1];
    else if(segs[0].split(' ').length<=2) hl=segs[0];
  }
  return {text:tidy(segs.join(' ')),hl:tidy(hl)};
}
function parseRows(rows){
  let map=null,start=0;
  const lim=Math.min(rows.length,6);
  for(let r=0;r<lim;r++){
    const m={};
    (rows[r]||[]).forEach(function(c,ci){const f=fieldOf(c); if(f&&m[f]===undefined) m[f]=ci;});
    if(m.en!==undefined&&m.zh!==undefined){map=m;start=r+1;break;}
  }
  if(!map){
    const colC=rows.map(function(r){return String(r&&r[2]!=null?r[2]:'').trim();}).filter(Boolean);
    const avg=colC.length?colC.reduce(function(a,s){return a+s.length;},0)/colC.length:99;
    map=avg<=8?{en:0,zh:1,pos:2,ex:3,exZh:4}:{en:0,zh:1,ex:2,exZh:3};
  }
  const get=function(r,k){return map[k]===undefined?'':String(r[map[k]]!=null?r[map[k]]:'').trim();};
  const words=[];let skipped=0;
  for(let i=start;i<rows.length;i++){
    const r=rows[i]||[];
    if(!r.some(function(c){return String(c!=null?c:'').trim()!=='';})) continue;
    const first=String(r[0]!=null?r[0]:'').trim();
    if(map.en===0&&/^精析/.test(first)){
      const en2=tidy(r[1]),zh2=tidy(r[2]);
      if(!en2||!zh2||CJK.test(en2)){skipped++;continue;}
      const sx2=splitHl(r[3]);
      words.push({en:en2,zh:zh2,pos:first,ex:sx2.text,exZh:'',hl:sx2.hl,cat:''});
      continue;
    }
    const en=get(r,'en'),zh=get(r,'zh');
    if(!en||!zh){skipped++;continue;}
    const sx=splitHl(get(r,'ex'));
    words.push({en:tidy(en),zh:tidy(zh),pos:get(r,'pos'),ex:sx.text,exZh:tidy(get(r,'exZh')),hl:sx.hl,cat:get(r,'cat')});
  }
  return {words:words,skipped:skipped,hadHeader:start>0};
}
function buildBook(sheets){
  const cats=[],byName=new Map(),seen=new Set(),sigs=new Set(),dupSheets=[];let skipped=0;
  sheets.forEach(function(sh){
    const res=parseRows(sh.rows||[]);
    const sig=res.words.map(function(w){return w.en.toLowerCase()+'>'+w.zh;}).join('|');
    if(res.words.length&&sigs.has(sig)){dupSheets.push(String(sh.name).trim());return;}
    if(res.words.length) sigs.add(sig);
    skipped+=res.skipped;
    res.words.forEach(function(w){
      const cn=String(w.cat||sh.name).trim();
      let c=byName.get(cn);
      if(!c){c={id:cn,name:cn,words:[]};byName.set(cn,c);cats.push(c);}
      const base=cn+'||'+w.en.toLowerCase();
      let id=base,n=1;
      while(seen.has(id)){n++;id=base+'#'+n;}
      seen.add(id);
      c.words.push({id:id,en:w.en,zh:w.zh,pos:w.pos,ex:w.ex,exZh:w.exZh,hl:w.hl});
    });
  });
  return {cats:cats.filter(function(c){return c.words.length;}),skipped:skipped,dupSheets:dupSheets};
}
function flatWords(book,catId){
  const out=[];
  if(catId===ALL){book.cats.forEach(function(c){c.words.forEach(function(w){out.push({w:w,cat:c.name});});});return out;}
  const c=book.cats.find(function(c){return c.id===catId;});
  if(c) c.words.forEach(function(w){out.push({w:w,cat:c.name});});
  return out;
}
function buildQueue(book,catId,known,startIx,includeKnown){
  const q=[];
  flatWords(book,catId).forEach(function(e,ix){
    if(ix>=startIx&&(includeKnown||!known[e.w.id])) q.push({w:e.w,cat:e.cat,ix:ix});
  });
  return q;
}

  get:function(k,d){
    try{const v=localStorage.getItem(k); if(v!==null) return JSON.parse(v);}catch(e){storeOK=false;}
    return (k in mem)?mem[k]:d;
  },
  set:function(k,v){
    mem[k]=v;
    try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){storeOK=false;return false;}
  }
};

/* ---------- tiny DOM helpers ---------- */
const $=function(s){return document.querySelector(s);};
function h(tag,props){
  const el=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      const v=props[k];
      if(k==='class') el.className=v;
      else if(k==='text') el.textContent=v;
      else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
      else if(v===true) el.setAttribute(k,'');
      else if(v!==false&&v!=null) el.setAttribute(k,v);
    });
  }
  for(let i=2;i<arguments.length;i++){
    const kids=[].concat(arguments[i]);
    kids.forEach(function(c){
      if(c==null||c===false) return;
      el.append(c.nodeType?c:document.createTextNode(String(c)));
    });
  }
  return el;
}

/* ---------- speech ---------- */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
const RATES={slow:0.7,normal:0.9,fast:1.05};
let voices=[];
function loadVoices(){if(!synth) return;try{voices=synth.getVoices()||[];}catch(e){voices=[];}}
if(synth){
  loadVoices();
  if(synth.addEventListener) synth.addEventListener('voiceschanged',loadVoices);
  else synth.onvoiceschanged=loadVoices;
}
function pickVoice(lang){
  const l=lang.toLowerCase();
  const c=voices.filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase()===l;});
  if(!c.length) return null;
  const score=function(v){return (/premium|enhanced|natural|neural/i.test(v.name)?3:0)+(/samantha|daniel|google/i.test(v.name)?1:0)+(v.localService?0.5:0);};
  return c.sort(function(a,b){return score(b)-score(a);})[0];
}
function speakable(t){return String(t).replace(/\s*[\/=]\s*/g,', ');}
function say(list){
  if(!synth) return;
  try{if(synth.speaking||synth.pending) synth.cancel();}catch(e){}
  list.filter(Boolean).forEach(function(t){
    const u=new SpeechSynthesisUtterance(speakable(t));
    u.lang=settings.accent;
    const v=pickVoice(settings.accent);
    if(v) u.voice=v;
    u.rate=RATES[settings.rate]||0.9;
    synth.speak(u);
  });
}
function speakBtn(label,fn){
  return h('button',{class:'speak',type:'button',onclick:function(ev){ev.stopPropagation();fn();}},ico('speaker'),label);
}

function twoStep(label,confirmLabel,action){
  let armed=false,timer;

}

/* ---------- home ---------- */
function countKnown(words){return words.filter(function(w){return known[w.id];}).length;}
function renderHome(){
  const list=$('#catList');list.replaceChildren();
  const rows=book.cats.map(function(c){return {id:c.id,name:c.name,total:c.words.length,k:countKnown(c.words)};});
  if(book.cats.length>1){
    const total=rows.reduce(function(n,r){return n+r.total;},0);
    const k=rows.reduce(function(n,r){return n+r.k;},0);
    rows.unshift({id:ALL,name:'全部單字',total:total,k:k});
  }
  rows.forEach(function(r){
    const p=pos[r.id]||0;
    const done=r.total>0&&r.k>=r.total;
    const meta=done?'全部已熟悉':(r.k+' / '+r.total+' 已熟悉'+(p>0?' · 上次看到第 '+(p+1)+' 個':''));
    const fill=h('i');fill.style.width=(r.total?Math.round(r.k/r.total*100):0)+'%';
    list.append(h('li',null,
      h('div',{class:'cat'+(done?' is-done':'')},
        h('button',{class:'cat-main',type:'button',onclick:function(){startStudy(r.id);}},
          h('span',{class:'cat-name',text:r.name}),
          h('span',{class:'cat-meta',text:meta}),
          h('span',{class:'meter','aria-hidden':'true'},fill)),
        h('button',{class:'icon-btn cat-more',type:'button','aria-label':r.name+' 的更多選項',onclick:function(){openCatSheet(r);}},ico('dots')))));
  });
  $('#emptyNote').hidden=book.cats.length>0;
  const n=book.cats.reduce(function(s,c){return s+c.words.length;},0);
  $('#homeFoot').textContent='單字庫共 '+book.cats.length+' 個分類、'+n+' 個單字。進度只存在這支手機的瀏覽器裡'+(storeOK?'。':'，而這個瀏覽器目前無法保存，關閉頁面後會消失。');
}

function openCatSheet(r){
  openSheet(function(s){

/* ---------- study ---------- */
let S=null;
function cur(){return S.queue[S.i].w;}
function startStudy(catId,opts){
  opts=opts||{};
  const includeKnown=!!opts.includeKnown;
  let start=opts.fresh?0:(pos[catId]||0);
  let q=buildQueue(book,catId,known,start,includeKnown);
  if(!q.length&&start>0){start=0;q=buildQueue(book,catId,known,0,includeKnown);}
  S={catId:catId,queue:q,i:0,revealed:false,done:false,allKnown:false,seen:0,newKnown:0,includeKnown:includeKnown};
  if(!q.length){S.done=true;S.allKnown=true;}
  $('#home').hidden=true;$('#study').hidden=false;
  showCard(true);
}
function savePos(){if(S&&!S.done){pos[S.catId]=S.queue[S.i].ix;savePosAll();}}
function showCard(speakFront){
  S.revealed=false;
  $('#cardWrap').scrollTop=0;
  if(!S.done) savePos();
  renderStudy();
  if(speakFront&&!S.done) autoFront();
}
function autoFront(){
  if(settings.dir==='en2zh'&&settings.autoWord) say([cur().en]);
  else if(synth&&synth.speaking){try{synth.cancel();}catch(e){}}
}
function reveal(){
  if(!S||S.done||S.revealed) return;
  S.revealed=true;renderStudy();
  const w=cur(),list=[];
  if(settings.dir==='zh2en'&&settings.autoWord) list.push(w.en);
  if(settings.autoEx&&w.ex) list.push(w.ex);
  if(list.length) say(list);
}
function next(){
  if(!S||S.done) return;
  S.seen=Math.max(S.seen,S.i+1);
  if(S.i<S.queue.length-1){S.i++;showCard(true);}
  else{S.done=true;pos[S.catId]=0;savePosAll();showCard(false);}
}
function prev(){
  if(!S||S.done||S.i===0) return;
  S.i--;showCard(true);
}
function markKnownNext(){
  const w=cur();
  if(!known[w.id]){known[w.id]=1;S.newKnown++;saveKnown();}
  toast('已記下，下次會跳過這個單字');
  next();
}
function unmarkKnown(){
  delete known[cur().id];saveKnown();
  toast('已取消，之後會再出現');
  renderStudy();
}
function updateBar(){
  $('#stCat').textContent=S.catId===ALL?'全部單字':S.catId;
  if(S.done){$('#stCount').textContent='完成';$('#progFill').style.width='100%';}
  else{$('#stCount').textContent=(S.i+1)+' / '+S.queue.length;$('#progFill').style.width=Math.round(S.i/S.queue.length*100)+'%';}
}
function wordEl(text){return h('div',{class:'word',lang:'en'},h('span',{class:'hl',text:text}));}
function sentenceWithMark(sentence,word,hl){
  const frag=document.createDocumentFragment();
  const lower=sentence.toLowerCase();
  const cands=[];
  if(hl) cands.push({t:hl,exact:true});
  String(word).split(/\s*[\/=()]\s*/).map(function(s){return s.trim();}).filter(Boolean)
    .sort(function(a,b){return b.length-a.length;}).forEach(function(t){cands.push({t:t,exact:false});});
  let idx=-1,end=-1;
  for(let k=0;k<cands.length&&idx<0;k++){
    const w=cands[k].t.toLowerCase();
    let from=0;
    while(true){
      const i=lower.indexOf(w,from);
      if(i<0) break;
      const b=lower.charAt(i-1);
      if(!b||!/[a-z]/.test(b)){
        idx=i;end=i+w.length;
        if(!cands[k].exact){let extra=0;while(end<sentence.length&&/[a-z]/i.test(sentence.charAt(end))&&extra<4){end++;extra++;}}
        break;
      }
      from=i+1;
    }
  }
  if(idx<0){frag.append(document.createTextNode(sentence));return frag;}
  if(idx>0) frag.append(document.createTextNode(sentence.slice(0,idx)));
  frag.append(h('mark',{text:sentence.slice(idx,end)}));
  if(end<sentence.length) frag.append(document.createTextNode(sentence.slice(end)));
  return frag;
}
function exampleBlock(w){
  const sent=h('p',{class:'ex-en',lang:'en'});
  sent.append(sentenceWithMark(w.ex,w.en,w.hl));
  const text=h('div',{class:'ex-text'},sent,w.exZh?h('p',{class:'ex-zh',lang:'zh-Hant',text:w.exZh}):null);
  const play=synth?h('button',{class:'icon-btn ring',type:'button','aria-label':'播放例句',onclick:function(ev){ev.stopPropagation();say([w.ex]);}},ico('speaker')):null;
  return h('div',{class:'example'},h('span',{class:'ex-label',text:'例句'}),h('div',{class:'ex-row'},text,play));
}
function renderStudy(){
  const card=$('#card');card.replaceChildren();
  updateBar();
  if(S.done){renderDone(card);renderActions();return;}
  const e=S.queue[S.i],w=e.w,en2zh=settings.dir==='en2zh';
  const top=h('div',{class:'card-top'});
  if(S.catId===ALL) top.append(h('span',{class:'chip',text:e.cat}));
  if(w.pos) top.append(h('span',{class:'chip',text:w.pos}));
  if(known[w.id]) top.append(h('span',{class:'chip chip-go'},ico('check'),'已熟悉'));
  const body=h('div',{class:'card-body'});
  if(en2zh){
    body.append(wordEl(w.en));
    if(synth) body.append(speakBtn('發音',function(){say([w.en]);}));
  }else{
    body.append(h('div',{class:'zh-big',lang:'zh-Hant',text:w.zh}));
  }
  if(!S.revealed){
    body.append(h('p',{class:'hint',text:en2zh?'點一下卡片，顯示中文':'點一下卡片，顯示英文'}));
  }else{
    const ans=h('div',{class:'answer'});
    if(en2zh){
      ans.append(h('div',{class:'zh-mid',lang:'zh-Hant',text:w.zh}));
    }else{
      ans.append(wordEl(w.en));
      if(synth) ans.append(speakBtn('發音',function(){say([w.en]);}));
    }
    if(w.ex) ans.append(exampleBlock(w));
    body.append(ans);
  }
  card.append(top,body);
  renderActions();
}
function renderDone(card){
  const all=S.allKnown;
  card.append(h('div',{class:'card-top'}));
  card.append(h('div',{class:'card-body done'},
    h('div',{class:'word'},h('span',{class:'hl',text:all?'都熟了':'這一輪完成'})),
    h('p',{class:'done-text',text:all?'這個分類的單字都已標記為熟悉。':'本輪看了 '+S.seen+' 個單字，新增 '+S.newKnown+' 個熟悉。'}),
    h('div',{class:'done-btns'},
      h('button',{class:'btn btn-primary',type:'button',text:all?'全部再複習一次':'再來一輪',onclick:function(){startStudy(S.catId,{fresh:true,includeKnown:all});}}),
      h('button',{class:'btn',type:'button',text:'回到分類',onclick:goHome}))));
}
function renderActions(){
  const a=$('#actions');a.replaceChildren();
  if(S.done){a.hidden=true;return;}
  a.hidden=false;
  const en2zh=settings.dir==='en2zh';
  const prevBtn=h('button',{class:'btn btn-prev',type:'button','aria-label':'上一個',disabled:S.i===0,onclick:prev},ico('chev'));
  if(!S.revealed){
    a.append(prevBtn,h('button',{class:'btn btn-primary',type:'button',text:en2zh?'顯示中文':'顯示英文',onclick:reveal}));
    return;
  }
  if(known[cur().id]){
    a.append(prevBtn,
      h('button',{class:'btn',type:'button',text:'取消熟悉',onclick:unmarkKnown}),
      h('button',{class:'btn btn-primary',type:'button',text:'下一個',onclick:next}));
  }else{
    a.append(prevBtn,
      h('button',{class:'btn',type:'button',text:'還不熟，下一個',onclick:next}),
      h('button',{class:'btn btn-go',type:'button',text:'已熟悉，下次跳過',onclick:markKnownNext}));
  }
}

/* ---------- settings ---------- */
function group(label){
  const g=h('div',{class:'group'},h('span',{class:'group-label',text:label}));
  for(let i=1;i<arguments.length;i++) if(arguments[i]) g.append(arguments[i]);
  return g;
}
function seg(key,opts){
  const wrap=h('div',{class:'seg',role:'group'});
  const btns=opts.map(function(o){
    return h('button',{type:'button','aria-pressed':String(settings[key]===o[0]),text:o[1],onclick:function(){
      settings[key]=o[0];saveSettings();
      btns.forEach(function(b,i){b.setAttribute('aria-pressed',String(opts[i][0]===o[0]));});
      if(key==='dir'&&S&&!S.done){S.revealed=false;renderStudy();}
    }});
  });
  btns.forEach(function(b){wrap.append(b);});
  return wrap;
}
function switchRow(key,label,id){
  const input=h('input',{id:id,type:'checkbox',class:'switch',role:'switch',onchange:function(){settings[key]=input.checked;saveSettings();}});
  input.checked=!!settings[key];
  return h('label',{class:'row',for:id},h('span',{text:label}),input);
}
function openSettings(){
  openSheet(function(s){
    const n=book.cats.reduce(function(t,c){return t+c.words.length;},0);
    s.append(h('h2',{class:'sheet-title',text:'設定'}));
    s.append(group('顯示方向',seg('dir',[['en2zh','英文 → 中文'],['zh2en','中文 → 英文']])));
    s.append(group('朗讀',
      switchRow('autoWord','自動朗讀單字','swWord'),
      switchRow('autoEx','自動朗讀例句','swEx')));
    s.append(group('語速',seg('rate',[['slow','慢'],['normal','正常'],['fast','快']])));
    s.append(group('口音',seg('accent',[['en-US','美式'],['en-GB','英式']])));
    if(synth) s.append(h('button',{class:'btn',type:'button',text:'試聽發音',onclick:function(){say(['Hello! This is how the words will sound.']);}}));
    else s.append(h('p',{class:'muted',text:'這個瀏覽器不支援朗讀功能。'}));
    s.append(group('單字庫',
      h('p',{class:'muted',text:'目前有 '+book.cats.length+' 個分類、'+n+' 個單字'+(usingImported?'（你匯入的 Excel）':'（內建）')+'。'}),
      h('button',{class:'btn btn-primary',type:'button',text:'匯入新的 Excel',onclick:openImport}),
      usingImported?h('button',{class:'btn',type:'button',text:'改回內建單字庫',onclick:restoreBuiltin}):null,
      twoStep('清除全部熟悉紀錄','再按一次，確定清除',function(){
        known={};saveKnown();pos={};savePosAll();closeSheet();goHome();toast('已清除全部熟悉紀錄');
      })));
    s.append(closeBtn());
  });
}

/* ---------- import ---------- */
let pending=null,errMsg='';
function readAs(file,mode){
  return new Promise(function(resolve,reject){
    const fr=new FileReader();
    fr.onload=function(){resolve(fr.result);};
    fr.onerror=function(){reject(fr.error||new Error('read'));};
    if(mode==='text') fr.readAsText(file,'utf-8'); else fr.readAsArrayBuffer(file);
  });
}
async function readSheets(file){
  if(typeof XLSX==='undefined') throw new Error('xlsx-missing');
  let wb;
  if(/\.csv$/i.test(file.name||'')){
    const text=String(await readAs(file,'text')).replace(/^﻿/,'');
    wb=XLSX.read(text,{type:'string'});
  }else{
    wb=XLSX.read(await readAs(file,'buffer'),{type:'array'});
  }
  return wb.SheetNames.map(function(n){
    return {name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',blankrows:false,raw:false})};
  });
}
function sampleTable(){
  const head=['英文','中文','詞性','例句','例句中文'];
  const row=['luggage','行李','n.','Please keep an eye on your luggage.','請留意你的行李。'];
  return h('div',{class:'tbl-wrap'},h('table',null,
    h('thead',null,h('tr',null,head.map(function(t){return h('th',{text:t});}))),
    h('tbody',null,h('tr',null,row.map(function(t){return h('td',{text:t});})))));
}
async function onFile(file,s){
  if(!file) return;
  try{
    const res=buildBook(await readSheets(file));
    if(!res.cats.length){pending=null;errMsg='沒有讀到單字。請確認第一列有「英文」和「中文」兩個標題，下面每列放一個單字。';}
    else{pending={cats:res.cats,skipped:res.skipped,dups:res.dupSheets,name:file.name};errMsg='';}
  }catch(e){
    pending=null;
    errMsg=(e&&e.message==='xlsx-missing')?'讀取 Excel 的元件沒有載入。請確認網路連線，重新整理頁面後再試。':'這個檔案讀不了。請確認是 .xlsx 或 .csv 檔。';
  }
  buildImport(s);
}
function restoreBuiltin(){
  store.set('wd.book',null);usingImported=false;book=BUILTIN;S=null;
  closeSheet();$('#home').hidden=false;$('#study').hidden=true;renderHome();toast('已改回內建單字庫');
}
function applyImport(){
  book={cats:pending.cats,importedAt:Date.now()};usingImported=true;
  const ok=store.set('wd.book',book);
  const n=pending.cats.reduce(function(t,c){return t+c.words.length;},0);
  pending=null;S=null;
  closeSheet();
  $('#home').hidden=false;$('#study').hidden=true;renderHome();
  toast(ok?'已匯入 '+n+' 個單字':'已匯入，但這個瀏覽器無法保存，關閉頁面後需重新匯入');
}
function buildImport(s){
  s.replaceChildren();
  s.append(h('h2',{class:'sheet-title',text:'匯入單字庫'}));
  if(!pending){
    s.append(h('p',{class:'muted',text:'選擇 Excel 檔。每個工作表會成為一個分類，工作表名稱就是分類名稱。第一列放標題，詞性、例句、例句中文可以省略。'}));
    s.append(sampleTable());
    s.append(h('p',{class:'muted',text:'想在同一個工作表裡分出多個分類，可以多加一欄「分類」。重新匯入時，已熟悉的紀錄會保留。'}));
    s.append(h('label',{class:'btn btn-primary file-btn',for:'fileIn',text:'選擇 Excel 檔'}));
    const inp=h('input',{id:'fileIn',type:'file',accept:'.xlsx,.xls,.csv',class:'vh'});
    inp.addEventListener('change',function(){onFile(inp.files&&inp.files[0],s);});
    s.append(inp);
    if(errMsg) s.append(h('p',{class:'err',role:'alert',text:errMsg}));
    s.append(closeBtn('取消'));
  }else{
    const n=pending.cats.reduce(function(t,c){return t+c.words.length;},0);
    s.append(h('p',{class:'muted',text:'「'+pending.name+'」讀到 '+pending.cats.length+' 個分類、'+n+' 個單字。'}));
    s.append(h('ul',{class:'sum'},pending.cats.map(function(c){return h('li',null,h('span',{text:c.name}),h('span',{text:c.words.length+' 個'}));})));
    if(pending.dups&&pending.dups.length) s.append(h('p',{class:'muted',text:'有 '+pending.dups.length+' 個內容重複的工作表已略過。'}));
    if(pending.skipped) s.append(h('p',{class:'muted',text:'有 '+pending.skipped+' 列無法當成單字卡，已略過。'}));
    s.append(h('button',{class:'btn btn-primary',type:'button',text:'使用這份單字庫',onclick:applyImport}));
    s.append(h('button',{class:'btn',type:'button',text:'重新選擇檔案',onclick:function(){pending=null;errMsg='';buildImport(s);}}));
  }
}
function openImport(){pending=null;errMsg='';openSheet(buildImport);}

/* ---------- wiring ---------- */
['#btnImport','#btnImport2'].forEach(function(id){const el=$(id);if(el) el.addEventListener('click',openImport);});
['#btnSettings','#btnSettings2'].forEach(function(id){$(id).addEventListener('click',openSettings);});
$('#btnImport').append(ico('upload'));
$('#btnSettings').append(ico('sliders'));
$('#btnSettings2').append(ico('sliders'));
$('#btnBack').append(ico('chev'));
$('#btnBack').addEventListener('click',goHome);
$('#cardWrap').addEventListener('click',function(){if(S&&$('#sheetBack').hidden) reveal();});
$('#sheetBack').addEventListener('click',function(e){if(e.target.id==='sheetBack') closeSheet();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheetBack').hidden){closeSheet();return;}
  if(!S||$('#study').hidden||!$('#sheetBack').hidden) return;
  if(e.target&&e.target.closest&&e.target.closest('button,input,label,a,select,textarea')) return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!S.revealed) reveal(); else next();}
  else if(e.key==='ArrowRight'){if(S.revealed) next(); else reveal();}
  else if(e.key==='ArrowLeft'){prev();}
  else if((e.key==='k'||e.key==='K')&&S.revealed&&!S.done&&!known[cur().id]){markKnownNext();}
  else if((e.key==='p'||e.key==='P')&&!S.done){say([cur().en]);}
});
renderHome();
})();
</script>
